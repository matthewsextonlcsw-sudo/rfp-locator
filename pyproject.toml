[project]
name = "rfp-empire"
version = "0.1.0"
description = "Local bid discovery and evidence review foundation"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
